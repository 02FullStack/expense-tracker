<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>Expense Tracker</title>
</head>

<body>
    <header>
        <h1>Budget Tracker</h1>
    </header>
    <main>
        <button>Dark Mode</button>
        <section id="summary">
            <div class="balance">
                <p>Balance</p>
                <p id="balance-total">$2,385</p>
            </div>
            <div class="summary-grid">
                <div class="income">
                    <p>Income</p>
                    <p id="income-total">$3,000</p>
                </div>
                <div class="expenses">
                    <p>Expenses</p>
                    <p id="expense-total">$615</p>
                </div>
                <div class="savings">
                    <p>Savings</p>
                    <p id="savings-total">$2,385</p>
                </div>
            </div>
        </section>
        <section id="transaction-form-section">
            <h2>Add Transaction</h2>
            <form action="" id="transaction-form">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" required>

                <label for="amount">Amount</label>
                <input type="number" id="amount" name="amount" require>

                <label for="category">Category</label>
                <select name="category" id="category" require>
                    <option value="Food">Food</option>
                    <option value="Housing">Housing</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Transportation">Transportation</option>
                    <option value="Salary">Salary</option>
                    <option value="Utilities">Utilities</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Other">Other</option>
                </select>

                <label for="date">Date</label>
                <input type="date" name="date" id="date" require>
                <div class="radios">
                    <input type="radio" name="type" id="income" value="income">
                    <label for="income">Income</label>
                    <input type="radio" name="type" id="expense" value="expense">
                    <label for="expense">Expense</label>
                </div>
                <button type="submit">Add Transaction</button>
            </form>
        </section>

        <section id="transactions">
            <h2>Transactions</h2>
            <ul id="transaction-list">
            </ul>
        </section>
    </main>

    <script type="module" src="js/main.js"></script>
</body>

</html>
